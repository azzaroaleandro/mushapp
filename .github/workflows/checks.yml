name: Verify Mushapp
on:
  push:
    branches: [main, codex/mushapp-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests and visual records
        run: npm run test:e2e
      - name: Assemble static app
        run: |
          mkdir -p site/src
          cp index.html styles.css icon.svg manifest.webmanifest sw.js site/
          cp src/*.js site/src/
          touch site/.nojekyll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: mushapp-site
          path: site/
          include-hidden-files: true
